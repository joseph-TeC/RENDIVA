<body>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar" aria-label="Navegación principal"></aside>
    <main class="main" id="main" tabindex="-1"></main>
    <aside class="rail" id="rail" aria-label="Tu progreso"></aside>
    <nav class="bottomnav" id="bottomnav" aria-label="Navegación"></nav>
  </div>

  <div id="session" class="session" hidden></div>
  <div id="modal"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- Formulario de contacto: envía los mensajes mediante Formspree -->
  <section id="contacto" aria-labelledby="contacto-titulo" style="max-width:640px;margin:32px auto;padding:24px;box-sizing:border-box;font-family:Nunito,system-ui,sans-serif;background:#fff;border:1px solid #e5e7eb;border-radius:16px;color:#1d2939;">
    <h2 id="contacto-titulo" style="margin:0 0 8px;font-size:24px;">Contáctanos</h2>
    <p style="margin:0 0 20px;color:#667085;">Envíanos tus dudas o comentarios.</p>
    <form action="https://formspree.io/f/xqpqgwwj" method="POST">
      <label for="contacto-nombre" style="display:block;margin:0 0 6px;font-weight:700;">Nombre</label>
      <input id="contacto-nombre" type="text" name="name" autocomplete="name" style="display:block;width:100%;box-sizing:border-box;margin:0 0 14px;padding:12px;border:1px solid #d0d5dd;border-radius:9px;font:inherit;">

      <label for="contacto-email" style="display:block;margin:0 0 6px;font-weight:700;">Correo electrónico</label>
      <input id="contacto-email" type="email" name="email" autocomplete="email" required style="display:block;width:100%;box-sizing:border-box;margin:0 0 14px;padding:12px;border:1px solid #d0d5dd;border-radius:9px;font:inherit;">

      <label for="contacto-mensaje" style="display:block;margin:0 0 6px;font-weight:700;">Mensaje</label>
      <textarea id="contacto-mensaje" name="message" rows="5" required style="display:block;width:100%;box-sizing:border-box;margin:0 0 16px;padding:12px;border:1px solid #d0d5dd;border-radius:9px;font:inherit;resize:vertical;"></textarea>

      <button type="submit" style="border:0;border-radius:9px;padding:12px 20px;background:#22b45a;color:#fff;font:inherit;font-weight:800;cursor:pointer;">Enviar mensaje</button>
    </form>
  </section>

  <noscript><p style="padding:24px;font-family:sans-serif">Necesitas activar JavaScript para usar esta página.</p></noscript>

  <!-- El orden importa: config → lecciones (gratis 1-4, gratis 5-8, solo Pro) → contenido → núcleo → mascota → extras -->
  <script src="config.js"></script>
  <script src="lecciones-gratis.js"></script>
  <script src="lecciones-gratis-2.js"></script>
  <script src="lecciones-pro.js"></script>
  <script src="content.js"></script>
  <script src="app.js"></script>
  <script src="mascota.js"></script>
  <script src="extras.js"></script>

  <!-- Red de seguridad: si algo no carga, avisa en pantalla en vez de dejarla en blanco -->
  <script>
    (function () {
      var lastErr = "";
      window.addEventListener("error", function (e) { if (e && e.message) lastErr = e.message; });
      window.addEventListener("load", function () {
        setTimeout(function () {
          var m = document.getElementById("main");
          if (!m || m.children.length) return;
          var box = document.createElement("div");
          box.style.cssText = "max-width:520px;margin:0 auto;padding:32px 20px;font-family:system-ui,sans-serif;line-height:1.5";
          var h = document.createElement("h1"); h.textContent = "🐂 Rendiva"; box.appendChild(h);
          var p = document.createElement("p");
          p.textContent = "La página no pudo cargar sus archivos. Descomprime la carpeta completa (no abras index.html desde dentro del .zip ni desde la vista previa de archivos) y ábrelo de nuevo, o súbela a tu hosting.";
          box.appendChild(p);
          if (lastErr) { var s = document.createElement("p"); s.style.cssText = "font-size:13px;opacity:.7"; s.textContent = "Detalle técnico: " + lastErr; box.appendChild(s); }
          m.appendChild(box);
        }, 400);
      });
    })();
  </script>
